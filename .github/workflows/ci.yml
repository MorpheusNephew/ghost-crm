name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm --filter web lint

  generated-api:
    name: Generated API is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:client
      - run: git diff --exit-code

  contracts-tests:
    name: Contracts tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ghost-crm/contracts test:coverage

  crm-tests:
    name: CRM tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ghost-crm/crm test:coverage

  web-tests:
    name: Web tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web test:coverage

  build:
    name: Production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ghost-crm/contracts build
      - run: pnpm --filter @ghost-crm/crm build
      - run: pnpm --filter web build
