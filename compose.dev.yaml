services:
  web:
    build:
      target: development
    # The named node_modules volume persists across restarts. Sync it from the
    # lockfile before Vite starts so newly added packages are available.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/apps/web/node_modules

volumes:
  web_node_modules:
